apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Card1sTree/travel-planner.git
    targetRevision: HEAD
    path: k8s
    helm:
      values: |
        replicaCount: 2
        image:
          registry: docker.io
          pullPolicy: IfNotPresent
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  notifications:
    - type: slack
      enabled: true
