name: Validate GitOps Manifests

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint k8s

      - name: Render Helm templates
        run: helm template travel-app k8s > rendered.yaml

      - name: Verify rendered output
        run: test -s rendered.yaml
