name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME_RECOMMENDATION: ghcr.io/Card1sTree/recommendation-engine
  IMAGE_NAME_USER_API: ghcr.io/Card1sTree/user-api
  IMAGE_NAME_TRIP_PLANNER: ghcr.io/Card1sTree/trip-planner

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/recommendation-engine/requirements.txt
          pip install -r services/user-api/requirements.txt
          pip install -r services/trip-planner/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --cov=services --cov-report=xml
          else
            echo "No tests directory found; skipping tests until tests are added."
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Recommendation Engine
        uses: docker/build-push-action@v6
        with:
          context: ./services/recommendation-engine
          push: true
          tags: |
            ${{ env.IMAGE_NAME_RECOMMENDATION }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push User API
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME_USER_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Trip Planner
        uses: docker/build-push-action@v6
        with:
          context: ./services/trip-planner
          push: true
          tags: |
            ${{ env.IMAGE_NAME_TRIP_PLANNER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
