name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: docker.io
  IMAGE_NAME_RECOMMENDATION: ${{ secrets.DOCKER_USERNAME }}/recommendation-engine
  IMAGE_NAME_USER_API: ${{ secrets.DOCKER_USERNAME }}/user-api
  IMAGE_NAME_TRIP_PLANNER: ${{ secrets.DOCKER_USERNAME }}/trip-planner

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/recommendation-engine/requirements.txt
        pip install -r services/user-api/requirements.txt
        pip install -r services/trip-planner/requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=services --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Recommendation Engine
      uses: docker/build-push-action@v4
      with:
        context: ./services/recommendation-engine
        push: true
        tags: |
          ${{ env.IMAGE_NAME_RECOMMENDATION }}:latest
          ${{ env.IMAGE_NAME_RECOMMENDATION }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push User API
      uses: docker/build-push-action@v4
      with:
        context: ./services/user-api
        push: true
        tags: |
          ${{ env.IMAGE_NAME_USER_API }}:latest
          ${{ env.IMAGE_NAME_USER_API }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Trip Planner
      uses: docker/build-push-action@v4
      with:
        context: ./services/trip-planner
        push: true
        tags: |
          ${{ env.IMAGE_NAME_TRIP_PLANNER }}:latest
          ${{ env.IMAGE_NAME_TRIP_PLANNER }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Trigger ArgoCD sync
      run: |
        curl -X POST ${{ secrets.ARGOCD_SERVER }}/api/v1/applications/travel-app/sync \
          -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{}'
